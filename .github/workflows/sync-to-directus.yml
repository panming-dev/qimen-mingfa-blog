name: Sync to Directus
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      operation:
        description: Directus operation to run
        required: true
        default: sync
        type: choice
        options:
          - sync
          - audit
          - cleanup

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Debug - List files
        run: |
          pwd
          ls -la
          ls -la scripts/ 2>/dev/null || echo "No scripts dir"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm config set registry https://registry.npmjs.org/
          npm cache clean --force
          npm install --no-audit --no-fund

      - name: Run Directus operation
        env:
          DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}
          CANONICAL_URL: ${{ secrets.CANONICAL_URL }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          REQUIRE_SEARCH_NOTIFICATIONS: 'true'
        run: |
          operation="${{ github.event.inputs.operation || 'sync' }}"
          case "$operation" in
            sync) npm run sync ;;
            audit) npm run audit:directus ;;
            cleanup) npm run cleanup:directus ;;
            *) echo "Unsupported operation: $operation" >&2; exit 1 ;;
          esac
